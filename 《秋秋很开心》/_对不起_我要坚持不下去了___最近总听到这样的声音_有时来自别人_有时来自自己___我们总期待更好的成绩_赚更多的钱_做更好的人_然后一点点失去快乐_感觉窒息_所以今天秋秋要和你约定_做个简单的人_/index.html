    <title>“对不起，我要坚持不下去了”

最近总听到这样的声音，有时来自别人，有时来自自己。

我们总期待更好的成绩，赚更多的钱，做更好的人，然后一点点失去快乐，感觉窒息…所以今天秋秋要和你约定，做个简单的人。

感受阅读，感受生活。

我不打算比以前更努力了，我只想过好我的独此一份。
