                       " id="js_content"><p>嘿嘿，机缘巧合很顺利的去寺庙生活一段时间。</p><p>寺里面是包吃包住，很凉快，然后每天跟着上课，做饭，现在在扫院子。</p><p><br></p><section><section style="display: inline-block;"><img data-ratio="0.562390148639679" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjiaawk3mtZXhRCBTaNesY66Z6jDgsspjCJuCtv2RPwmPHZw5CK9np8lr9X0fOogKJMtia1huibLwQia8w/640?wx_fmt=png" data-type="jpg" data-w="2276" src="./assets/17791585321030.06048232084872662.png"></section>​</section><section><section style="display: inline-block;"><img data-ratio="0.562390148639679" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjiaawk3mtZXhRCBTaNesY66Zo2WgcohWicIe1frBRfYfYjgicon0PVckCsiazvlt2bV6924QdmqsG6JPQ/640?wx_fmt=png" data-type="jpg" data-w="2276" src="./assets/17791585321170.346104775923173.png"></section>​</section><p><br></p><p>早上4.30起床，感觉一天都慢了。</p><p>好喜欢这里的生活～</p><p>晚上没事我打算写文章记录一下，发大号里。</p><p style="text-align: right;"><br></p><p style="text-align: right;">2022.8.24</p><p style="text-align: right;">秋秋</p></div>
