                       " id="js_content"><p>之前摄影需要给模特化妆，我觉得我技术一般，就报了一个化妆班，这两天天气好，就去上课了。</p><p><br></p><p><span style="font-weight: bold;">老师教的还挺好，很细致。</span></p><p><br></p><p>有很多同学是其他城市过来，学完直接就业，当化妆师。</p><p><br></p><p>老师说学的好也给在北京推荐工作哈哈，还很热情的鼓励我。</p><p><br></p><section><section style="display: inline-block;"><img data-ratio="0.562390148639679" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjh2oPGrEgwoNLxW2ScLIO53aFBkmObZnWgianouHNica2IjMbtaUwJAZ4tS4jaSQ8ZxrXAs2JCQFM4g/640?wx_fmt=png" data-type="jpg" data-w="2276" src="./assets/17791585316220.7814088583101074.png"></section>​</section><section><section style="display: inline-block;"><img data-ratio="0.5628742575645447" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjh2oPGrEgwoNLxW2ScLIO53omqxByYq14a8CR4gCCoJXMRLfNOSa2VxQicSOcvKjmYSrPNq5NbzIdQ/640?wx_fmt=png" data-type="jpg" data-w="1169" src="./assets/17791585316320.3603925976289565.png"></section>​</section><section><section style="display: inline-block;"><img data-ratio="0.562390148639679" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjh2oPGrEgwoNLxW2ScLIO53pJaD5ymrGSdd1jN37NswH9FFwB6icW829ia3wwcBb4k9U1lLKu7iajKPQ/640?wx_fmt=png" data-type="jpg" data-w="2276" src="./assets/17791585316400.8842543605293374.png"></section>​</section><p><br></p><p>今天练习了一下午眉毛，还学了几个发型，又是行动力满分的一天。</p><p><br></p><p>退休真好。</p></div>
