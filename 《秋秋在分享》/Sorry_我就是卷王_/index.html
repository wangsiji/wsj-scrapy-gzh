                       " id="js_content"><p>秋秋来啦～</p><p><br></p><p>今天干了两顿饭！</p><p><br></p><section><section style="display: inline-block;"><img data-ratio="0.562390148639679" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjhV37KYIsrcZEqH0vibWotwAibTU8D3VYkQpYzagcWFTamxxaPCHj8psAvMklnuYXJrZRKzbcWIMAwQ/640?wx_fmt=png" data-type="jpg" data-w="2276" src="./assets/17791585318050.6997655910574208.png"></section>​</section><p><br></p><p>我发现虽然嘴上说着我躺平啦～实际大家千万别信我！</p><p><br></p><p><span style="font-weight: bold;">一直想尝试有新鲜感，还有学学学拍拍拍真是刻在骨子的。</span><br></p><p><br></p><p>真的退休了，没有赚钱的压力了，我也学摄影学化妆拍照做视频，没有那种天天玩手机的时候。</p><p><br></p><section><section style="display: inline-block;"><img data-ratio="0.562390148639679" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjhV37KYIsrcZEqH0vibWotwA8yffDQGTDjuO9ibUeCtpCzl8EMOIBPKSPLfIkic8LgCoTXuia54oZFkmg/640?wx_fmt=png" data-type="jpg" data-w="2276" src="./assets/17791585318160.020415041854822347.png"></section>​</section><section><section style="display: inline-block;"><br></section></section><section><section style="display: inline-block;">反正就是我觉得学喜欢的东西充满热情！</section></section><section><section style="display: inline-block;"><br></section></section><section><section style="display: inline-block;">虽然别人看起来很卷，实际上自己乐在其中。</section></section><section><section style="display: inline-block;"><br></section></section><section><section style="display: inline-block;"><br></section></section><section><section style="display: inline-block;"><img data-ratio="0.21886120736598969" data-src="https://mmbiz.qpic.cn/mmbiz_png/RV0rqC6kCjhV37KYIsrcZEqH0vibWotwA4dcsPdau392NMPI9VGTic3FpfAfKhCoyXsOz4qIqzuqQtTWxNVicdYVg/640?wx_fmt=png" data-type="jpg" data-w="1124" src="./assets/17791585318250.4588936147879854.png"></section>​</section><p><br>对了，发现自己中了一个新债赚了300➕，卖了周末请大老王搓一顿了哈哈哈</p><p><br></p><p>大家也周末快乐呀</p><p><br></p><p><br></p></div>
